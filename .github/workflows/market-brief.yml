name: 资本市场资讯采集
on:
  push:
    branches: [test/chatgpt-market-pipeline-check]
    paths: [requests/latest.json]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: capital-market-collect
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: 获取资讯和行情
        id: collect
        continue-on-error: true
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
        run: python3 collect_market_data.py
      - name: 发布本期数据或错误状态
        if: github.event_name == 'push'
        run: |
          if [ -d data ] && [ -n "$(git status --porcelain -- data/)" ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add data/
            git commit -m 'Publish market data snapshot'
            for attempt in 1 2 3; do
              git pull --rebase origin test/chatgpt-market-pipeline-check
              if git push origin HEAD:test/chatgpt-market-pipeline-check; then exit 0; fi
            done
            exit 1
          fi
      - name: 报告采集错误
        if: steps.collect.outcome == 'failure'
        run: exit 1
